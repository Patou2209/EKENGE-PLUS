name: ekenge_plus
description: "EKENGE PLUS - Application mobile de securite et de partage de localisation en temps reel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  # Firebase (versions verrouillees, compatibles Flutter 3.35.4)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  firebase_messaging: 15.1.3
  firebase_app_check: 0.3.1+4
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  crypto: ^3.0.5
  intl: ^0.20.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  web: ^1.1.1
  # §4 : acces au vrai repertoire du telephone + demande d'autorisation
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1
  # Retour haptique du bouton Danger (§7)
  vibration: ^2.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
