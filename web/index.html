<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application mobile de securite et de partage de localisation en temps reel.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0B0E">
  <meta name="apple-mobile-web-app-title" content="EKENGE PLUS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EKENGE PLUS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin:0; padding:0; background:#0A0B0E; }
    #ek-boot {
      position:fixed; inset:0; background:#0A0B0E; display:flex;
      align-items:center; justify-content:center; flex-direction:column;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      z-index:9999; transition:opacity .4s ease;
    }
    #ek-boot .mark {
      width:64px; height:64px; border-radius:50%; border:1px solid rgba(23,200,180,.55);
      background:#1C2028; display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 30px rgba(23,200,180,.18);
    }
    #ek-boot .mark svg { width:30px; height:30px; stroke:#17C8B4; fill:none; stroke-width:1.6; }
    #ek-boot .wm { margin-top:22px; font-size:15px; font-weight:600; letter-spacing:3.3px; color:#F2F4F8; }
    #ek-boot .wm span { color:#17C8B4; }
    #ek-boot .sub { margin-top:10px; font-size:7.8px; font-weight:600; letter-spacing:1.6px; color:#636B7C; }
  </style>
</head>
<body>
  <div id="ek-boot">
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6l7-3z"/></svg>
    </div>
    <div class="wm">EKENGE<span>&#8201;PLUS</span></div>
    <div class="sub">SECURITE PERSONNELLE</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('ek-boot');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
